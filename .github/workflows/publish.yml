---
name: Publish

on:
  # schedule:
  #   - cron: '20 11 * * 0'
  # push:
  #   branches:
  #     - main
  workflow_dispatch:


env:
  IMAGE_NAME: fholzer/nginx-brotli-poc
  TARGET_ARCHS: linux/amd64,linux/arm64,linux/ppc64le


jobs:
  build-version-list:
    runs-on: ubuntu-latest
    outputs:
      nginx_versions: ${{ steps.nginx_versions.outputs.nginx_versions }}
    steps:
      - uses: actions/checkout@v7

      - name: Read nginx versions
        id: nginx_versions
        run: |
          (
            echo -n "nginx_versions="
            jq -R -s -c '[split("\n")[]|select(. | length > 0)]' < versions.txt
          ) >> "$GITHUB_OUTPUT"


  build-base:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build builder-base image
        uses: docker/build-push-action@v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: ${{ env.TARGET_ARCHS }}
          target: builder-base
          cache-from: type=gha
          cache-to: type=gha,mode=max


  build-test-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: main
    strategy:
      matrix:
        nginx_version: ${{ fromJson(needs.build-version-list.outputs.nginx_versions) }}
    needs:
      - build-version-list
      - build-base

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate image tags
        id: image_tags
        run: python ci/getPublishTags.py ${{ matrix.nginx_version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build amd64 image
        uses: docker/build-push-action@v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          build-args: |
            NGINX_VERSION=${{ matrix.nginx_version }}
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.nginx_version }}
          # output to docker so we can test in next step
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: List images
        run: |
          docker images

      - name: Test
        run: |
          docker run --rm -v $(pwd)/tests/tests.sh:/tests.sh --entrypoint sh ${{ env.IMAGE_NAME }}:${{ matrix.nginx_version }} /tests.sh

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
          images: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.image_tags.outputs.nginx_tags }}

      - name: Build and publish multi-platform images
        uses: docker/build-push-action@v7.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: ${{ env.TARGET_ARCHS }}
          build-args: |
            NGINX_VERSION=${{ matrix.nginx_version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
